server.port=8002
server.servlet.context-path=/

spring.application.name=parlance

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/parlance
spring.datasource.username=parlance
spring.datasource.password=parlance123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=8f4d2a9e6b1c7f3e0d5a8b2c4e6f8d1a3c5e7b9d2f4a6c8e0b3d5f7a9c1e3f5
app.jwt.access-expiry=86400000
app.jwt.refresh-expiry=604800000

# Admin
app.admin.email=admin@parlance.com
app.admin.password=Admin1234!
app.admin.username=admin

# CORS
app.cors.origins=https://parlance-dev.preview.emergentagent.com,http://localhost:3000,http://localhost:8001

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.parlance=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
