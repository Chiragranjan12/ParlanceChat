# ============================================
# Application Configuration
# ============================================
spring.application.name=parlance
server.port=8001
server.servlet.context-path=/

# ============================================
# Database Configuration
# ============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parlancechat}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA & Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================
# JWT Configuration
# ============================================
app.jwt.secret=${JWT_SECRET:your-default-secret-key-change-this-in-production}
app.jwt.access-expiry=${JWT_ACCESS_EXPIRY:86400000}
app.jwt.refresh-expiry=${JWT_REFRESH_EXPIRY:604800000}

# ============================================
# Admin Seed Configuration
# ============================================
app.admin.email=${ADMIN_EMAIL:admin@parlance.com}
app.admin.password=${ADMIN_PASSWORD:change-this-admin-password}
app.admin.username=${ADMIN_USERNAME:admin}

# ============================================
# CORS Configuration
# ============================================
app.cors.origins=${CORS_ORIGINS:https://parlance-dev.preview.emergentagent.com,http://localhost:3000,http://localhost:8001,https://*.preview.emergentagent.com,https://*.preview.emergentcf.cloud,https://*.emergentcf.cloud,https://*.emergentagent.com}

# ============================================
# Jackson Configuration
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.property-naming-strategy=SNAKE_CASE

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.parlance=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ============================================
# Connection Pool
# ============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
